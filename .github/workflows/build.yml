name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Unzip
        run: for f in *.zip; do unzip -o "$f"; done
      - name: Build
        working-directory: ScreenTimeBar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTimeBar-apk
          path: ScreenTimeBar/app/build/outputs/apk/debug/*.apk
